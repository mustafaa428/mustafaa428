name: Generate Snake Animation

on:
  schedule:
    - cron: "0 6 * * *"   # Her gün sabah 06:00 UTC
  workflow_dispatch:

jobs:
  generate:
    name: Snake SVG
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Generate snake SVG (dark theme, blue palette)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#60a5fa&color_dots=#0d1117,#1e3a8a,#1d4ed8,#2563eb,#60a5fa

      - name: Push SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
