name: Update README Stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch GitHub stats and update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: mustafaa428
        run: |
          # GitHub API'den veri çek
          STATS=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/users/$USERNAME")
          
          REPOS=$(echo $STATS | python3 -c "import sys,json; print(json.load(sys.stdin)['public_repos'])")
          FOLLOWERS=$(echo $STATS | python3 -c "import sys,json; print(json.load(sys.stdin)['followers'])")
          FOLLOWING=$(echo $STATS | python3 -c "import sys,json; print(json.load(sys.stdin)['following'])")

          # README içindeki badge satırlarını güncelle
          sed -i "s|public_repos-[0-9]*-|public_repos-${REPOS}-|g" README.md
          sed -i "s|followers-[0-9]*-|followers-${FOLLOWERS}-|g" README.md
          sed -i "s|following-[0-9]*-|following-${FOLLOWING}-|g" README.md

      - name: Commit updated README
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update README stats [skip ci]"
          git push
